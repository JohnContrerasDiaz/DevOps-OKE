title: "DevOps-OKE network"
description: "VCN for an OKE custom cluster with OCI CNI, private API and workers, public load balancers, and a public bastion subnet."
schemaVersion: 1.1.0
version: "1.0.0"
locale: "en"

variableGroups:
  - title: "OCI placement"
    variables:
      - compartment_ocid
      - region
  - title: "Resource naming"
    variables:
      - name_prefix
      - vcn_dns_label
  - title: "Public access controls"
    variables:
      - bastion_ssh_ingress_cidr
      - load_balancer_ingress_cidr

variables:
  compartment_ocid:
    type: oci:identity:compartment:id
    title: "Network compartment"
    description: "Compartment where the VCN, subnets, gateways, route tables, and security lists are created."
    required: true
  region:
    type: oci:identity:region:name
    title: "Region"
    description: "OCI region where the network is created."
    required: true
  name_prefix:
    type: string
    title: "Resource name prefix"
    description: "Prefix used for all network resources except the bastion subnet, whose name is fixed to bastion."
    required: true
    default: "devops-oke"
  vcn_dns_label:
    type: string
    title: "VCN DNS label"
    description: "Lowercase DNS label, maximum 15 alphanumeric characters."
    required: true
    default: "devopsoke"
  bastion_ssh_ingress_cidr:
    type: string
    title: "Bastion SSH ingress CIDR"
    description: "Public administrative source allowed to SSH to a future bastion VM. Use a single public IP with /32 whenever possible."
    required: true
  load_balancer_ingress_cidr:
    type: string
    title: "Load balancer ingress CIDR"
    description: "Source allowed to reach public load balancer listeners on ports 80 and 443."
    required: true
    default: "0.0.0.0/0"

outputGroups:
  - title: "OKE Custom Create"
    outputs:
      - vcn_id
      - kubernetes_api_subnet_id
      - worker_nodes_subnet_id
      - pods_subnet_id
      - load_balancers_subnet_id
      - bastion_subnet_id

outputs:
  vcn_id:
    type: string
    title: "VCN OCID"
  kubernetes_api_subnet_id:
    type: string
    title: "Private Kubernetes API subnet OCID"
  worker_nodes_subnet_id:
    type: string
    title: "Private worker nodes subnet OCID"
  pods_subnet_id:
    type: string
    title: "Private pods subnet OCID"
  load_balancers_subnet_id:
    type: string
    title: "Public load balancers subnet OCID"
  bastion_subnet_id:
    type: string
    title: "Public bastion subnet OCID"
