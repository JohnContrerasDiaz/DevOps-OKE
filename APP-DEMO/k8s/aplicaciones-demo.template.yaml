apiVersion: v1
kind: Namespace
metadata:
  name: app-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-ai-config
  namespace: app-demo
data:
  OCI_REGION: "__OCI_REGION__"
  OCI_COMPARTMENT_ID: "__OCI_COMPARTMENT_ID__"
  OCI_GENAI_MODEL_ID: "__OCI_GENAI_MODEL_ID__"
  OCI_GENAI_ENDPOINT: "https://inference.generativeai.__OCI_REGION__.oci.oraclecloud.com"
  FASTAPI_ROOT_PATH: "/api"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-ai
  namespace: app-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-ai
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend-ai
    spec:
      imagePullSecrets:
      - name: ocir-secret
      containers:
      - name: backend
        image: __BACKEND_IMAGE__
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: backend-ai-config
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: backend-ai-svc
  namespace: app-demo
spec:
  ports:
  - name: http
    port: 8000
    targetPort: http
  selector:
    app: backend-ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-ai
  namespace: app-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-ai
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend-ai
    spec:
      imagePullSecrets:
      - name: ocir-secret
      containers:
      - name: web-interface
        image: __FRONTEND_IMAGE__
        imagePullPolicy: Always
        ports:
        - containerPort: 8501
          name: http
        env:
        - name: BACKEND_URL
          value: "http://backend-ai-svc:8000"
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-ai-svc
  namespace: app-demo
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: frontend-ai